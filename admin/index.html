<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pingle Law — Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  /* ---- Admin dashboard ----
     Edits the announcement banner, settlement tiles, legal team, and
     blog posts directly on this page. Each editor loads from the repo
     through Netlify Git Gateway and saves by committing back - the same
     API and login Decap CMS uses. Self-contained: own styles, no site
     CSS; the look intentionally follows a light SaaS-dashboard style
     rather than the marketing site's navy/gold. */
  :root{
    --bg:#F5F6F8; --card:#FFFFFF; --line:#E5E7EB; --line-strong:#D1D5DB;
    --ink:#111827; --muted:#6B7280; --soft:#9CA3AF; --field:#F3F4F6; --field-hover:#EEF0F3;
    --accent:#1F7A5C; --accent-700:#155E47; --accent-100:#E3F1EB; --accent-50:#F0F8F4;
    --danger:#DC2626; --danger-100:#FEE2E2; --warn-100:#FEF3C7; --warn-800:#92400E;
    --info-100:#E0ECFF; --info-800:#1E40AF;
    --r-card:20px; --r-inner:14px; --r-field:12px;
    --shadow:0 1px 2px rgba(17,24,39,0.04), 0 10px 30px -22px rgba(17,24,39,0.25);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; }
  svg{ flex:none; }
  [hidden]{ display:none !important; }
  ::placeholder{ color:var(--soft); }

  /* ---- Layout ---- */
  .shell{ display:grid; grid-template-columns:264px 1fr; min-height:100vh; }
  .sidebar{ background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0; height:100vh; z-index:60; }
  .brand{ display:flex; align-items:center; gap:10px; padding:2px 10px 22px; }
  .brand-mark{ width:36px; height:36px; border-radius:10px; background:#0A0F27; display:grid; place-items:center; flex:none; overflow:hidden; }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brand-name{ font-weight:700; font-size:15px; letter-spacing:-0.01em; line-height:1.15; }
  .brand-name span{ display:block; font-size:11px; font-weight:500; color:var(--muted); letter-spacing:0.04em; text-transform:uppercase; }
  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav a{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; color:var(--muted); font-weight:500; transition:background .15s ease, color .15s ease; }
  .nav a svg{ width:19px; height:19px; }
  .nav a:hover{ background:var(--field); color:var(--ink); }
  .nav a.is-current{ background:var(--field); color:var(--ink); font-weight:600; }
  .sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:2px; }
  .sidebar-foot a, .sidebar-foot button{ display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; border-radius:12px; border:none; background:none; text-align:left; color:var(--muted); font-weight:500; cursor:pointer; }
  .sidebar-foot a:hover, .sidebar-foot button:hover{ background:var(--field); color:var(--ink); }
  .sidebar-foot svg{ width:19px; height:19px; }
  .backdrop{ display:none; position:fixed; inset:0; background:rgba(17,24,39,0.45); z-index:55; }

  .main{ min-width:0; display:flex; flex-direction:column; }
  .topbar{ display:flex; align-items:center; gap:14px; padding:16px 32px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40; }
  .menu-btn{ display:none; width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--card); align-items:center; justify-content:center; cursor:pointer; color:var(--ink); }
  .menu-btn svg{ width:20px; height:20px; }
  .crumbs{ display:flex; align-items:center; gap:8px; color:var(--muted); font-weight:500; font-size:15px; min-width:0; }
  .crumbs svg{ width:15px; height:15px; color:var(--soft); }
  .crumbs b{ color:var(--ink); font-weight:600; white-space:nowrap; }
  .topbar-spacer{ flex:1; }
  .search{ position:relative; width:min(360px, 34vw); }
  .search svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--soft); }
  .search input{ width:100%; height:44px; border:none; border-radius:999px; background:var(--field); padding:0 16px 0 42px; font:inherit; color:var(--ink); }
  .search input:focus{ outline:none; box-shadow:0 0 0 3px rgba(31,122,92,0.18); background:var(--card); }
  .icon-btn{ width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; cursor:pointer; color:var(--ink); position:relative; }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn:hover{ background:var(--field); }
  .icon-btn .dot{ position:absolute; top:10px; right:11px; width:8px; height:8px; border-radius:50%; background:var(--accent); border:2px solid var(--card); display:none; }
  .icon-btn.has-dot .dot{ display:block; }
  .who{ display:flex; align-items:center; gap:10px; padding:4px 6px 4px 4px; border-radius:999px; border:1px solid transparent; cursor:pointer; background:none; }
  .who:hover{ background:var(--field); }
  .avatar{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--accent-100); color:var(--accent-700); font-weight:700; font-size:14px; }
  .who-text{ line-height:1.2; text-align:left; }
  .who-text b{ display:block; font-size:13.5px; font-weight:600; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .who-text span{ font-size:12px; color:var(--muted); }
  .who > svg{ width:16px; height:16px; color:var(--soft); }
  .pop{ position:absolute; top:calc(100% + 8px); right:0; width:320px; background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 20px 50px -20px rgba(17,24,39,0.35); padding:8px; z-index:45; }
  .pop-title{ font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; padding:8px 10px 6px; }
  .pop-item{ display:flex; gap:10px; padding:9px 10px; border-radius:10px; font-size:13px; }
  .pop-item:hover{ background:var(--field); }
  .pop-item .t{ color:var(--muted); font-size:12px; white-space:nowrap; }
  .pop-item .m{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pop-empty{ padding:12px 10px; color:var(--muted); font-size:13px; }
  .pop button{ display:flex; align-items:center; gap:10px; width:100%; padding:10px; border:none; background:none; border-radius:10px; text-align:left; cursor:pointer; color:var(--ink); }
  .pop button:hover{ background:var(--field); }
  .pop button svg{ width:17px; height:17px; color:var(--muted); }
  .rel{ position:relative; }

  .content{ padding:28px 32px 56px; }
  .view{ display:none; }
  .view.is-active{ display:block; }
  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; }
  .page-head h1{ margin:0 0 4px; font-size:28px; font-weight:600; letter-spacing:-0.02em; }
  .page-head p{ margin:0; color:var(--muted); max-width:660px; font-size:15px; }
  .page-head-actions{ display:flex; align-items:center; gap:12px; flex:none; flex-wrap:wrap; justify-content:flex-end; }
  .grid-rail{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:24px; align-items:start; }

  /* ---- Buttons ---- */
  .btn{ display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:12px; border:1px solid transparent; font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; transition:background .15s ease, border-color .15s ease, transform .15s ease, opacity .15s ease; }
  .btn svg{ width:17px; height:17px; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none !important; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover:not(:disabled){ background:var(--accent-700); transform:translateY(-1px); }
  .btn-dark{ background:var(--ink); color:#fff; }
  .btn-dark:hover:not(:disabled){ background:#1F2937; }
  .btn-ghost{ background:var(--card); border-color:var(--line); color:var(--ink); }
  .btn-ghost:hover:not(:disabled){ border-color:var(--line-strong); background:var(--field); }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:10px; }
  .btn-icon{ padding:0; width:34px; height:34px; justify-content:center; border-radius:10px; }
  .btn-danger{ background:var(--card); border-color:var(--line); color:var(--danger); }
  .btn-danger:hover:not(:disabled){ background:var(--danger-100); border-color:transparent; }
  .link-danger{ background:none; border:none; color:var(--danger); font-weight:600; cursor:pointer; padding:6px 0; font-size:13.5px; }
  .link-danger:disabled{ opacity:0.45; cursor:not-allowed; }

  /* ---- Cards ---- */
  .card{ background:var(--card); border-radius:var(--r-card); padding:24px; box-shadow:var(--shadow); }
  .card + .card{ margin-top:20px; }
  .card h2{ margin:0 0 18px; font-size:18px; font-weight:600; letter-spacing:-0.01em; }
  .card h2 small{ font-weight:500; color:var(--muted); font-size:13px; margin-left:8px; }

  .stats{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; margin-bottom:24px; }
  .stat{ background:var(--card); border-radius:var(--r-card); padding:20px 22px; box-shadow:var(--shadow); }
  .stat-top{ display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:13px; font-weight:500; }
  .stat-top .ico{ width:36px; height:36px; border-radius:11px; display:grid; place-items:center; background:var(--accent-100); color:var(--accent-700); }
  .stat-top .ico svg{ width:18px; height:18px; }
  .stat-num{ margin-top:14px; font-size:30px; font-weight:600; letter-spacing:-0.02em; line-height:1; }
  .stat-sub{ margin-top:8px; font-size:12.5px; color:var(--soft); }
  .stat-num.is-live::after{ content:"live"; margin-left:8px; vertical-align:middle; font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent-700); background:var(--accent-100); padding:3px 8px; border-radius:999px; }

  .manage{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; }
  .tile{ display:flex; flex-direction:column; gap:10px; padding:20px; border:1.5px solid var(--line); border-radius:var(--r-inner); background:var(--card); transition:border-color .15s ease, box-shadow .15s ease; }
  .tile:hover{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-100); }
  .tile-head{ display:flex; align-items:center; gap:12px; font-weight:600; font-size:15.5px; }
  .tile-head .ico{ width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:var(--field); color:var(--ink); }
  .tile-head .ico svg{ width:18px; height:18px; }
  .tile p{ margin:0; color:var(--muted); font-size:13.5px; flex:1; }
  .tile-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .kv{ display:flex; flex-direction:column; gap:14px; }
  .kv > div{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; font-size:14px; }
  .kv span:first-child{ color:var(--muted); display:flex; align-items:center; gap:10px; flex:none; }
  .kv svg{ width:17px; height:17px; color:var(--soft); }
  .kv b{ font-weight:500; text-align:right; min-width:0; overflow-wrap:anywhere; }
  .pill{ display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:999px; font-size:12.5px; font-weight:600; background:var(--accent-100); color:var(--accent-700); white-space:nowrap; }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.is-muted{ background:var(--field); color:var(--muted); }
  .pill.is-warn{ background:var(--warn-100); color:var(--warn-800); }
  .pill.is-busy{ background:var(--info-100); color:var(--info-800); }
  .pill.is-error{ background:var(--danger-100); color:var(--danger); }
  .tip{ background:var(--accent-50); border:1px solid var(--accent-100); border-radius:var(--r-card); padding:20px; display:flex; gap:14px; }
  .tip .ico{ width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; flex:none; }
  .tip .ico svg{ width:16px; height:16px; }
  .tip b{ display:block; font-weight:600; margin-bottom:3px; color:var(--accent-700); font-size:15px; }
  .tip p{ margin:0; font-size:13.5px; color:#2F5A49; line-height:1.5; }

  /* ---- Notices ---- */
  .notice{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:var(--r-inner); margin-bottom:18px; font-size:13.5px; line-height:1.5; }
  .notice svg{ width:18px; height:18px; margin-top:1px; flex:none; }
  .notice-warn{ background:var(--warn-100); color:var(--warn-800); }
  .notice-error{ background:var(--danger-100); color:#7F1D1D; }
  .notice b{ font-weight:600; }

  /* ---- Editors: list items ---- */
  .list-section{ margin-bottom:24px; }
  .list-section-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .list-section-head h2{ margin:0; font-size:17px; font-weight:600; }
  .list-section-head span{ font-size:13px; color:var(--muted); }
  .items{ display:flex; flex-direction:column; gap:14px; }
  .item{ background:var(--card); border-radius:var(--r-card); box-shadow:var(--shadow); overflow:hidden; }
  .item.has-error{ box-shadow:var(--shadow), 0 0 0 2px var(--danger); }
  .item-head{ display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); }
  .item-index{ width:28px; height:28px; border-radius:9px; background:var(--field); color:var(--ink); font-size:12.5px; font-weight:600; display:grid; place-items:center; flex:none; }
  .item-summary{ flex:1; min-width:0; font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item-summary.is-empty{ color:var(--soft); font-weight:500; }
  .item-tools{ display:flex; gap:6px; }
  .item-body{ padding:20px; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px 18px; }
  .field{ display:flex; flex-direction:column; gap:7px; min-width:0; }
  .field.span-2{ grid-column:1 / -1; }
  .field label{ font-size:13.5px; font-weight:500; color:var(--ink); display:flex; gap:6px; align-items:baseline; }
  .field label .req{ color:var(--danger); }
  .field label .opt{ font-weight:400; color:var(--soft); font-size:12px; }
  .field input[type="text"], .field input[type="email"], .field input[type="date"], .field textarea, .field select{
    width:100%; font:inherit; font-size:14.5px; color:var(--ink);
    padding:13px 16px; border:1.5px solid transparent; border-radius:var(--r-field); background:var(--field);
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .field input:hover, .field textarea:hover, .field select:hover{ background:var(--field-hover); }
  .field textarea{ min-height:96px; resize:vertical; }
  .field select{ appearance:none; padding-right:40px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7280' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 14px center; background-size:16px; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; background:var(--card); border-color:var(--accent); box-shadow:0 0 0 3px rgba(31,122,92,0.15); }
  .field.is-invalid input, .field.is-invalid textarea, .field.is-invalid select{ border-color:var(--danger); background:var(--card); }
  .field-hint{ font-size:12px; color:var(--soft); }
  .field-error{ font-size:12px; color:var(--danger); font-weight:500; }
  .radios{ display:flex; gap:20px; flex-wrap:wrap; }
  .radio{ display:flex; align-items:center; gap:9px; cursor:pointer; font-size:14.5px; }
  .radio input{ appearance:none; width:20px; height:20px; border-radius:50%; border:2px solid var(--line-strong); margin:0; display:grid; place-items:center; cursor:pointer; }
  .radio input::before{ content:""; width:10px; height:10px; border-radius:50%; background:var(--accent); transform:scale(0); transition:transform .12s ease; }
  .radio input:checked{ border-color:var(--accent); }
  .radio input:checked::before{ transform:scale(1); }
  .radio input:disabled{ opacity:0.5; cursor:not-allowed; }

  .photo{ display:grid; grid-template-columns:104px minmax(0,1fr); gap:16px; align-items:start; }
  .photo-preview{ width:104px; height:104px; border-radius:var(--r-field); background:var(--field) center/cover no-repeat; display:grid; place-items:center; color:var(--soft); font-size:12px; text-align:center; overflow:hidden; }
  .photo-preview.is-empty{ background-image:none; }
  .photo-controls{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .photo-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .photo-row select{ flex:1; min-width:180px; }
  .photo-row input[type="file"]{ display:none; }
  .photo-path input{ font-size:12.5px !important; color:var(--muted) !important; font-family:ui-monospace, SFMono-Regular, Menlo, monospace !important; padding:10px 14px !important; }
  .photo-msg{ font-size:12px; color:var(--muted); }
  .photo-msg.is-error{ color:var(--danger); }
  .add-row{ margin-top:12px; }
  .empty-state{ padding:34px; text-align:center; color:var(--muted); background:var(--card); border-radius:var(--r-card); border:1.5px dashed var(--line-strong); }
  .loading{ padding:40px; text-align:center; color:var(--muted); }

  /* ---- Blog ---- */
  .posts{ display:flex; flex-direction:column; }
  .post-row{ display:grid; grid-template-columns:minmax(0,1fr) 120px 110px auto; gap:16px; align-items:center; padding:14px 6px; border-top:1px solid var(--line); }
  .post-row:first-child{ border-top:none; }
  .post-row .title{ font-weight:600; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .post-row .title small{ display:block; font-weight:400; color:var(--soft); font-size:12px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  .post-row .date{ color:var(--muted); font-size:13.5px; }
  .md-toolbar{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .md-toolbar button{ height:34px; min-width:34px; padding:0 10px; border-radius:9px; border:1px solid var(--line); background:var(--card); cursor:pointer; font-size:13px; font-weight:600; color:var(--ink); display:inline-flex; align-items:center; gap:6px; }
  .md-toolbar button:hover:not(:disabled){ background:var(--field); }
  .md-toolbar button:disabled{ opacity:0.45; cursor:not-allowed; }
  .md-toolbar button svg{ width:15px; height:15px; }
  .md-split{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .md-split textarea{ min-height:420px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13.5px; line-height:1.6; }
  .md-preview{ min-height:420px; border-radius:var(--r-field); background:var(--field); padding:18px 20px; overflow:auto; font-size:15px; line-height:1.65; }
  .md-preview h2{ font-size:22px; margin:18px 0 8px; font-weight:600; letter-spacing:-0.01em; }
  .md-preview h3{ font-size:17px; margin:16px 0 6px; font-weight:600; }
  .md-preview h2:first-child, .md-preview h3:first-child, .md-preview p:first-child{ margin-top:0; }
  .md-preview p{ margin:0 0 12px; }
  .md-preview ul{ margin:0 0 12px; padding-left:22px; }
  .md-preview a{ color:var(--accent-700); text-decoration:underline; }
  .md-preview-label{ font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; }
  .md-preview .is-empty{ color:var(--soft); }

  /* ---- View heroes (shared by every section) ----
     Same dark animated panel language as the AI Crawlers page: kicker,
     title, one-line summary, count-up chips, the section's primary
     actions, and a small animated graphic specific to that content. */
  .vhero{ position:relative; overflow:hidden; border-radius:var(--r-card); padding:28px 30px; margin-bottom:22px;
    background:radial-gradient(120% 140% at 85% 20%, #1c2a57 0%, #0A0F27 55%, #070a1c 100%); color:#fff;
    display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:24px; align-items:center; }
  .vhero::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.05) 45%, transparent 60%); background-size:250% 100%; animation:vShine 7s ease-in-out infinite; }
  .vhero-kicker{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#9fb3ff; }
  .vhero h1{ margin:12px 0 6px; font-size:32px; font-weight:700; letter-spacing:-0.02em; line-height:1.1; color:#fff; }
  .vhero-sub{ color:#c7cfe8; font-size:14.5px; max-width:520px; margin:0; }
  .vhero-chips{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  .vhero-chip{ background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); border-radius:14px; padding:10px 14px; min-width:96px; }
  .vhero-chip b{ display:block; font-size:22px; font-weight:700; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; line-height:1.1; }
  .vhero-chip span{ font-size:11.5px; color:#aab4d6; text-transform:uppercase; letter-spacing:0.05em; }
  .vhero-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; position:relative; z-index:1; }
  .vhero .btn-ghost{ background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.18); color:#fff; }
  .vhero .btn-ghost:hover:not(:disabled){ background:rgba(255,255,255,0.16); border-color:rgba(255,255,255,0.3); }
  .vhero .btn-primary{ background:#2f9c74; }
  .vhero .btn-primary:hover:not(:disabled){ background:#34ad80; }
  .vhero .btn:disabled{ opacity:0.4; }
  .vhero-art{ justify-self:end; width:240px; height:190px; position:relative; }
  .vhero-art svg{ width:100%; height:100%; overflow:visible; }

  /* Banner: live preview strip */
  .bn-preview{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); border-radius:12px; overflow:hidden; box-shadow:0 18px 40px -18px rgba(0,0,0,0.7); }
  .bn-strip{ background:#B38A3C; height:44px; position:relative; overflow:hidden; }
  .bn-msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:0 12px; text-align:center;
    color:#fff; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; text-shadow:0 1px 2px rgba(0,0,0,0.25);
    opacity:0; animation:bnCycle var(--dur) linear infinite; animation-delay:var(--delay); }
  .bn-strip::after{ content:""; position:absolute; top:0; bottom:0; left:-60%; width:45%; background:linear-gradient(115deg, transparent, rgba(255,255,255,0.5), transparent); mix-blend-mode:soft-light; animation:bnShine 4s ease-in-out infinite; }
  .bn-site{ background:#0A0F27; padding:10px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #B38A3C; }
  .bn-logo{ font-weight:800; font-size:13px; letter-spacing:-0.02em; color:#fff; } .bn-logo i{ font-style:normal; color:#B38A3C; }
  .bn-burger{ width:16px; height:10px; border-top:2px solid #fff; border-bottom:2px solid #fff; position:relative; }
  .bn-burger::after{ content:""; position:absolute; left:0; right:0; top:2px; border-top:2px solid #fff; }
  .bn-body{ background:#F3EFE6; height:52px; display:flex; flex-direction:column; gap:6px; padding:10px 12px; }
  .bn-body span{ display:block; height:6px; border-radius:3px; background:#e2dccd; } .bn-body span:nth-child(2){ width:70%; } .bn-body span:nth-child(3){ width:45%; }

  /* Settlements: amounts chart */
  .st-bars{ display:flex; align-items:flex-end; justify-content:center; gap:10px; height:150px; padding-top:18px; }
  .st-bar{ position:relative; width:26px; border-radius:6px 6px 2px 2px; background:linear-gradient(180deg, #d9b56a, #B38A3C); transform-origin:bottom; animation:aiGrowY .9s cubic-bezier(.2,.8,.2,1) both; box-shadow:0 10px 24px -12px rgba(179,138,60,0.8); }
  .st-bar b{ position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); font-size:10.5px; font-weight:700; color:#fff; white-space:nowrap; }
  .st-axis{ height:1px; background:rgba(255,255,255,0.2); margin-top:0; }

  /* Team: avatar stack */
  .tm-stack{ display:flex; align-items:center; justify-content:center; height:100%; }
  .tm-av{ width:74px; height:74px; border-radius:50%; background:#1c2a57 center/cover no-repeat; border:3px solid #0A0F27; margin-left:-18px; box-shadow:0 12px 26px -10px rgba(0,0,0,0.8); animation:tmPop .6s cubic-bezier(.34,1.56,.64,1) both; }
  .tm-av:first-child{ margin-left:0; }
  .tm-av.is-more{ display:grid; place-items:center; font-weight:700; font-size:16px; background:#2f9c74; }

  /* Blog: fanned document cards */
  .bl-fan{ position:relative; width:100%; height:100%; }
  .bl-doc{ position:absolute; left:50%; top:50%; width:110px; height:140px; margin:-70px 0 0 -55px; border-radius:10px; background:#fff; box-shadow:0 18px 36px -14px rgba(0,0,0,0.7);
    padding:14px 12px; transform-origin:50% 120%; animation:blFan .8s cubic-bezier(.2,.8,.2,1) both; }
  .bl-doc span{ display:block; height:6px; border-radius:3px; background:#e5e7eb; margin-bottom:7px; }
  .bl-doc span:first-child{ height:10px; width:80%; background:#0A0F27; margin-bottom:12px; }
  .bl-doc span:nth-child(3){ width:85%; } .bl-doc span:nth-child(5){ width:60%; }
  .bl-doc .tag{ position:absolute; bottom:12px; left:12px; font-size:9px; font-weight:700; padding:2px 7px; border-radius:999px; background:var(--accent-100); color:var(--accent-700); }
  .bl-doc .tag.draft{ background:var(--field); color:var(--muted); }

  /* Dashboard extras */
  .rs-bars{ display:flex; flex-direction:column; gap:12px; }
  .rs-row{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:center; }
  .rs-row .n{ font-size:13.5px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rs-row .n small{ color:var(--muted); font-weight:500; margin-left:6px; }
  .rs-row .v{ font-size:13.5px; font-weight:700; font-variant-numeric:tabular-nums; }
  .rs-track{ grid-column:1 / -1; height:8px; border-radius:999px; background:var(--field); overflow:hidden; }
  .rs-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, #d9b56a, #B38A3C); transform-origin:left; animation:aiGrowX 1s cubic-bezier(.2,.8,.2,1) both; }
  .act-feed{ position:relative; display:flex; flex-direction:column; }
  .act-feed::before{ content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line); border-radius:2px; }
  .act-item{ position:relative; padding:0 0 14px 24px; font-size:13px; animation:aiRise .4s cubic-bezier(.2,.8,.2,1) both; }
  .act-item:last-child{ padding-bottom:0; }
  .act-item::before{ content:""; position:absolute; left:1px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--card); box-shadow:0 0 0 1px var(--line); }
  .act-item.is-fresh::before{ animation:vDotPulse 1.8s ease-out infinite; }
  .act-item b{ display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .act-item span{ color:var(--soft); font-size:12px; }

  /* Hover lift on interactive surfaces */
  .tile, .stat, .item, .ai-tile{ transition:transform .2s ease, box-shadow .2s ease, border-color .15s ease; }
  .tile:hover, .stat:hover, .ai-tile:hover{ transform:translateY(-3px); box-shadow:0 1px 2px rgba(17,24,39,0.04), 0 18px 36px -22px rgba(17,24,39,0.35); }
  .photo-preview{ transition:transform .25s ease; } .photo-preview:hover{ transform:scale(1.04); }
  .nav a svg{ transition:transform .2s ease; } .nav a:hover svg, .nav a.is-current svg{ transform:scale(1.12); }

  /* Entrance: only while switching sections (route() adds .is-entering
     for ~1s), so editing - which re-renders often - never re-animates. */
  .view.is-entering .vhero, .view.is-entering > .page-head{ animation:aiRise .5s cubic-bezier(.2,.8,.2,1) both; }
  .view.is-entering .stat, .view.is-entering .tile, .view.is-entering .card, .view.is-entering .tip,
  .view.is-entering .item, .view.is-entering .post-row, .view.is-entering .list-section-head{ animation:aiRise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:.08s; }
  .view.is-entering :is(.stats, .manage, .items, .posts) > :nth-child(2){ animation-delay:.14s; }
  .view.is-entering :is(.stats, .manage, .items, .posts) > :nth-child(3){ animation-delay:.2s; }
  .view.is-entering :is(.stats, .manage, .items, .posts) > :nth-child(4){ animation-delay:.26s; }
  .view.is-entering :is(.stats, .manage, .items, .posts) > :nth-child(5){ animation-delay:.32s; }
  .view.is-entering :is(.stats, .manage, .items, .posts) > :nth-child(n+6){ animation-delay:.38s; }

  @keyframes vShine{ 0%, 100%{ background-position:120% 0; } 50%{ background-position:-20% 0; } }
  @keyframes vGlow{ 0%, 100%{ opacity:1; } 50%{ opacity:.65; } }
  @keyframes vDotPulse{ 0%{ box-shadow:0 0 0 1px var(--line), 0 0 0 0 rgba(31,122,92,0.45); } 100%{ box-shadow:0 0 0 1px var(--line), 0 0 0 9px rgba(31,122,92,0); } }
  @keyframes bnCycle{ 0%{ opacity:0; transform:translateX(30px); } 4%, 30%{ opacity:1; transform:translateX(0); } 34%, 100%{ opacity:0; transform:translateX(-30px); } }
  @keyframes bnShine{ 0%{ left:-60%; } 45%, 100%{ left:130%; } }
  @keyframes tmPop{ from{ opacity:0; transform:scale(.4) translateY(12px); } }
  @keyframes blFan{ from{ transform:rotate(0deg) translateY(20px); opacity:0; } }
  @media (prefers-reduced-motion: reduce){
    .vhero *, .vhero::after, .view.is-entering *, .act-item, .act-item::before{ animation:none !important; }
    .bn-msg{ opacity:0; } .bn-msg:first-child{ opacity:1; }
    .tile:hover, .stat:hover, .ai-tile:hover, .photo-preview:hover{ transform:none; }
  }
  @media (max-width:760px){
    .vhero{ grid-template-columns:1fr; padding:22px; }
    .vhero-art{ display:none; }
    .vhero h1{ font-size:26px; }
  }

  /* ---- AI Crawlers view ----
     Series colors are the dataviz reference palette's first three
     categorical slots (validated as a set, all-pairs, light surface):
     one per crawler TYPE, and every mark that carries a type color also
     carries its type as text (aqua sits under 3:1 contrast - relief rule). */
  .ai-root{ --t-training:#2a78d6; --t-search:#eb6834; --t-live:#1baf7a; --grid:#EEF0F3; }
  .ai-hero{ position:relative; overflow:hidden; border-radius:var(--r-card); padding:28px 30px; margin-bottom:20px;
    background:radial-gradient(120% 140% at 85% 20%, #1c2a57 0%, #0A0F27 55%, #070a1c 100%); color:#fff;
    display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:24px; align-items:center; }
  .ai-hero-kicker{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#9fb3ff; }
  .ai-live-dot{ width:8px; height:8px; border-radius:50%; background:#34d399; box-shadow:0 0 0 0 rgba(52,211,153,0.6); animation:aiPing 1.8s ease-out infinite; }
  .ai-hero-num{ font-size:56px; font-weight:700; letter-spacing:-0.03em; line-height:1; margin:14px 0 6px; font-variant-numeric:tabular-nums; }
  .ai-hero-sub{ color:#c7cfe8; font-size:14px; max-width:460px; }
  .ai-split{ display:flex; height:10px; border-radius:999px; overflow:hidden; gap:2px; margin-top:20px; background:rgba(255,255,255,0.08); max-width:460px; }
  .ai-split span{ height:100%; transform-origin:left; animation:aiGrowX .9s cubic-bezier(.2,.8,.2,1) both; }
  .ai-split-legend{ display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:10px; font-size:12.5px; color:#c7cfe8; }
  .ai-split-legend b{ color:#fff; font-weight:600; }
  .ai-key{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .ai-radar{ width:220px; height:220px; justify-self:end; }
  .ai-radar .ring{ fill:none; stroke:rgba(159,179,255,0.18); }
  .ai-radar .pulse{ fill:none; stroke:rgba(159,179,255,0.55); transform-origin:110px 110px; animation:aiRing 3.2s ease-out infinite; }
  .ai-radar .pulse.p2{ animation-delay:1.06s; } .ai-radar .pulse.p3{ animation-delay:2.13s; }
  .ai-radar .sweep{ transform-origin:110px 110px; animation:aiSpin 6s linear infinite; }
  .ai-radar .blip{ transform-box:fill-box; transform-origin:center; animation:aiBlip 2.4s ease-in-out infinite; }
  .ai-radar .core{ fill:#fff; }

  .ai-tiles{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; margin-bottom:20px; }
  .ai-tile{ background:var(--card); border-radius:var(--r-card); padding:18px 20px; box-shadow:var(--shadow); animation:aiRise .5s cubic-bezier(.2,.8,.2,1) both; }
  .ai-tile:nth-child(2){ animation-delay:.06s; } .ai-tile:nth-child(3){ animation-delay:.12s; } .ai-tile:nth-child(4){ animation-delay:.18s; }
  .ai-tile-label{ font-size:12.5px; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:8px; }
  .ai-tile-num{ font-size:30px; font-weight:600; letter-spacing:-0.02em; margin-top:10px; font-variant-numeric:tabular-nums; line-height:1; }
  .ai-tile-sub{ font-size:12px; color:var(--soft); margin-top:8px; }
  .ai-delta{ font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .ai-delta.up{ background:var(--accent-100); color:var(--accent-700); } .ai-delta.flat{ background:var(--field); color:var(--muted); }
  .ai-delta.down{ background:var(--warn-100); color:var(--warn-800); }
  .ai-spark{ display:block; width:100%; height:34px; margin-top:10px; }
  .ai-spark path.line{ fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:var(--len); stroke-dashoffset:var(--len); animation:aiDraw 1.2s .2s cubic-bezier(.2,.8,.2,1) forwards; }

  .ai-grid2{ display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:20px; align-items:start; }
  .ai-grid2 > .card{ margin:0; }
  .ai-card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .ai-card-head h2{ margin:0 !important; }
  .ai-card-head p{ margin:4px 0 0; font-size:12.5px; color:var(--muted); }
  .ai-legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--ink); }
  .ai-chart-outer{ position:relative; }
  .ai-chart-wrap{ overflow-x:auto; overflow-y:hidden; }
  .ai-chart{ display:block; width:100%; min-width:460px; height:auto; }
  .ai-chart .gridline{ stroke:var(--grid); stroke-width:1; }
  .ai-chart .axis{ fill:var(--soft); font-size:11px; font-family:inherit; }
  .ai-chart .day{ transform-box:fill-box; transform-origin:50% 100%; animation:aiGrowY .7s cubic-bezier(.2,.8,.2,1) both; transition:opacity .15s ease; }
  .ai-chart.is-hovering .day{ opacity:.35; } .ai-chart.is-hovering .day.is-hot{ opacity:1; }
  .ai-chart .hit{ fill:transparent; cursor:crosshair; outline:none; }
  .ai-chart .zero{ fill:var(--grid); }
  .ai-tip{ position:absolute; pointer-events:none; background:var(--ink); color:#fff; border-radius:10px; padding:9px 12px; font-size:12.5px; line-height:1.5; box-shadow:0 12px 30px -12px rgba(17,24,39,0.5); opacity:0; transform:translate(-50%, -8px); transition:opacity .12s ease; white-space:nowrap; z-index:3; }
  .ai-tip.is-on{ opacity:1; }
  .ai-tip b{ display:block; margin-bottom:2px; }
  .ai-table{ margin-top:14px; font-size:13px; }
  .ai-table summary{ cursor:pointer; color:var(--muted); font-weight:500; }
  .ai-table table{ width:100%; border-collapse:collapse; margin-top:10px; }
  .ai-table th, .ai-table td{ text-align:right; padding:6px 8px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .ai-table th:first-child, .ai-table td:first-child{ text-align:left; }
  .ai-table th{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; border-top:none; }

  .ai-bars{ display:flex; flex-direction:column; gap:14px; }
  .ai-bar-row{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:center; animation:aiRise .45s cubic-bezier(.2,.8,.2,1) both; }
  .ai-bar-name{ font-size:13.5px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ai-bar-name small{ font-weight:500; color:var(--muted); margin-left:6px; }
  .ai-bar-val{ font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
  .ai-bar-track{ grid-column:1 / -1; height:8px; border-radius:999px; background:var(--field); overflow:hidden; }
  .ai-bar-fill{ height:100%; border-radius:999px; transform-origin:left; animation:aiGrowX .9s cubic-bezier(.2,.8,.2,1) both; }
  .ai-views{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:14px; }
  .ai-views .sp{ flex:1; }
  .ai-custom{ gap:8px; } .ai-custom label{ font-size:12.5px; color:var(--muted); font-weight:600; } .ai-custom input[type=date]{ font:inherit; font-size:13px; padding:6px 8px; border:1.5px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  .ai-hm-cap{ font-size:12px; color:var(--muted); margin:-2px 0 8px; }
  .ai-hm-scroll{ overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .ai-hm{ display:grid; gap:3px; align-items:center; min-width:540px; }
  .ai-hm .hm-name{ font-size:13px; font-weight:600; padding-right:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:sticky; left:0; background:var(--card); z-index:1; }
  .ai-hm .hm-h{ font-size:10.5px; color:var(--soft); text-align:center; font-variant-numeric:tabular-nums; }
  .ai-hm .hm-h.is-mark{ color:var(--muted); font-weight:600; }
  .ai-hm .hm-c{ height:26px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:600; font-variant-numeric:tabular-nums; background:var(--field); color:var(--soft); }
  .ai-hm .hm-c.has{ background:color-mix(in srgb, var(--hc) calc(var(--a) * 100%), var(--field)); color:var(--ink); }
  .ai-hm .hm-c.has.hi{ color:#fff; }
  .ai-hm .hm-t{ font-size:12.5px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; padding-left:6px; }
  .ai-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .ai-chip{ appearance:none; border:1.5px solid var(--line); background:var(--card); color:var(--muted); font:inherit; font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer; transition:background .15s ease, color .15s ease, border-color .15s ease; }
  .ai-chip:hover{ border-color:var(--accent); color:var(--ink); }
  .ai-chip[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--card); }
  .ai-bar-track.segbar{ display:flex; gap:2px; background:var(--field); }
  .ai-bar-track.segbar .ai-bar-fill{ border-radius:0; flex:none; }
  .ai-bar-track.segbar .ai-bar-fill:first-child{ border-radius:999px 0 0 999px; }
  .ai-bar-track.segbar .ai-bar-fill:last-child{ border-radius:0 999px 999px 0; }
  .ai-bar-track.segbar .ai-bar-fill:only-child{ border-radius:999px; }
  .ai-bar-meta{ grid-column:1 / -1; font-size:11.5px; color:var(--soft); }

  .ai-feed{ position:relative; display:flex; flex-direction:column; }
  .ai-feed::before{ content:""; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:var(--line); border-radius:2px; }
  .ai-feed-item{ position:relative; padding:0 0 16px 28px; animation:aiRise .4s cubic-bezier(.2,.8,.2,1) both; }
  .ai-feed-item:last-child{ padding-bottom:0; }
  .ai-feed-dot{ position:absolute; left:2px; top:4px; width:12px; height:12px; border-radius:50%; border:2px solid var(--card); box-shadow:0 0 0 1px var(--line); }
  .ai-feed-dot.is-fresh::after{ content:""; position:absolute; inset:-2px; border-radius:50%; background:inherit; animation:aiPingSoft 1.8s ease-out infinite; }
  .ai-feed-top{ display:flex; justify-content:space-between; gap:10px; font-size:13.5px; }
  .ai-feed-top b{ font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ai-feed-top span{ color:var(--soft); font-size:12px; white-space:nowrap; }
  .ai-feed-path{ font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere; }
  .ai-type{ display:inline-block; font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--field); color:var(--ink); margin-top:5px; }

  /* ---- Tile redesign (stat tiles, AI tiles, Manage Content cards) ----

  .stats > :nth-child(4n+1), .ai-tiles > :nth-child(4n+1), .manage > :nth-child(4n+1){ --tc:#1F7A5C; }

    border:1px solid var(--line); border-radius:var(--r-card);
    background:#fff;
    background:linear-gradient(155deg, #fff 55%, color-mix(in srgb, var(--tc, #1F7A5C) 8%, #fff) 100%);

  }
  .stat::after, .ai-tile::after, .tile::after{
    content:""; position:absolute; right:-34px; bottom:-34px; width:112px; height:112px; border-radius:50%;
    border:16px solid var(--tc, #1F7A5C); opacity:.06; z-index:-1; transition:transform .35s ease, opacity .35s ease;
  }
  .stat:hover, .ai-tile:hover, .tile:hover{
    transform:translateY(-3px);
    border-color:color-mix(in srgb, var(--tc, #1F7A5C) 35%, var(--line));
    box-shadow:0 1px 2px rgba(17,24,39,0.04), 0 20px 36px -22px color-mix(in srgb, var(--tc, #1F7A5C) 55%, transparent);
  }
  .stat:hover::after, .ai-tile:hover::after, .tile:hover::after{ transform:scale(1.15); opacity:.1; }
  .stat-top .ico, .tile-head .ico{
    background:var(--tc, #1F7A5C); color:#fff;
    box-shadow:0 8px 18px -8px var(--tc, #1F7A5C);
  }
  .stat-num, .ai-tile-num{ font-size:32px; font-weight:700; letter-spacing:-0.025em; }
  .stat-top, .ai-tile-label{ color:var(--ink); font-weight:600; font-size:13px; }
  .stat-sub, .ai-tile-sub{ color:var(--muted); }
  .tile{ padding:22px; }
  .tile .btn-ghost{ background:#fff; }
  @media (prefers-reduced-motion: reduce){
    .stat:hover, .ai-tile:hover, .tile:hover{ transform:none; }
    .stat::after, .ai-tile::after, .tile::after{ transition:none; }
  }

  /* ---- Toast ---- */
  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(10px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px; font-size:13.5px; font-weight:500; box-shadow:0 16px 40px -14px rgba(17,24,39,0.6); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:80; max-width:calc(100vw - 32px); }
  .toast.is-on{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.is-error{ background:var(--danger); }

  /* ---- Login gate ---- */
  /* z-index:90, not 100: the Netlify Identity widget's own login iframe
     (#netlify-identity-widget) renders at z-index:99 - with this gate at
     100 it sat ON TOP of that iframe, so clicking "Sign In" genuinely
     opened the real login form (confirmed - the form was there in the
     DOM, fully functional) but it was invisible and unclickable behind
     this overlay the whole time. Has to stay below 99. */
  .gate{ position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:24px; }
  .gate-card{ width:100%; max-width:400px; background:var(--card); border-radius:var(--r-card); box-shadow:var(--shadow); padding:36px 32px; text-align:center; }
  .gate-card .brand-mark{ width:52px; height:52px; border-radius:14px; margin:0 auto 18px; }
  .gate-card .brand-mark img{ width:100%; height:100%; }
  .gate-card h1{ margin:0 0 6px; font-size:22px; font-weight:600; letter-spacing:-0.01em; }
  .gate-card p{ margin:0 0 22px; color:var(--muted); }
  .gate-card .btn{ width:100%; justify-content:center; padding:13px 16px; font-size:14.5px; }
  body.is-authed .gate{ display:none; }
  body:not(.is-authed) .shell{ visibility:hidden; }

  /* ---- Responsive ---- */
  @media (max-width:1180px){
    .grid-rail{ grid-template-columns:1fr; }
    .stats{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    .md-split{ grid-template-columns:1fr; }
    .search{ width:min(260px, 30vw); }
  }
  @media (max-width:900px){
    .shell{ grid-template-columns:1fr; }
    /* Sidebar becomes an off-canvas drawer: stays on the left, hidden
       until the menu button opens it. */
    .sidebar{ position:fixed; left:0; top:0; bottom:0; width:280px; height:100vh; transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 20px 60px -20px rgba(17,24,39,0.5); }
    body.is-menu-open .sidebar{ transform:translateX(0); }
    body.is-menu-open .backdrop{ display:block; }
    .menu-btn{ display:inline-flex; }
    .topbar{ padding:12px 16px; gap:10px; }
    .search{ display:none; }
    .crumbs{ flex:1; min-width:0; }
    .crumbs b{ overflow:hidden; text-overflow:ellipsis; }
    .who-text, .who > svg{ display:none; }
    .who{ padding:2px; }
    .content{ padding:20px 16px 48px; }
    .manage{ grid-template-columns:1fr; }
    .page-head{ flex-direction:column; }
    .page-head-actions{ justify-content:flex-start; }
    .item-body{ grid-template-columns:1fr; }
    .post-row{ grid-template-columns:minmax(0,1fr) auto; }
    .post-row .date{ display:none; }
    .pop{ right:-8px; width:min(320px, calc(100vw - 32px)); }
  }
  @media (max-width:560px){
    .stats{ grid-template-columns:1fr; }
    .crumbs .hide-sm{ display:none; }
    .photo{ grid-template-columns:1fr; }
    .page-head h1{ font-size:24px; }
  }

  /* =====================================================================
     App-frame theme: blue-gray backdrop with the app in a rounded window,
     soft gray sidebar with grouped nav, white workspace, flat bordered
     cards, blue primary, delta pills, and thin-line charts with mono axis
     labels.
     ===================================================================== */
  :root{
    --bg:#F6F7F9; --card:#FFFFFF; --line:#E7EAEF; --line-strong:#D5DAE2;
    --ink:#171B24; --muted:#6B7280; --soft:#9AA1AD; --field:#F3F5F8; --field-hover:#ECEFF3;
    --accent:#1F6FB5; --accent-700:#185A93; --accent-100:#E2EDF8; --accent-50:#F1F6FC;
    --r-card:14px; --r-inner:10px; --r-field:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04);
    --mono:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  body{ background:#D9DEE6; }
  .shell{ margin:14px; border-radius:18px; background:var(--bg); box-shadow:0 0 0 1px #CDD3DC, 0 30px 60px -40px rgba(15,23,42,.45); min-height:calc(100vh - 28px); overflow:clip; grid-template-columns:250px 1fr; }
  .sidebar{ background:var(--bg); border-right:none; top:14px; height:calc(100vh - 28px); padding:20px 14px; }
  .brand{ padding:2px 8px 18px; }
  .nav{ gap:2px; }
  .nav a{ padding:9px 12px; border-radius:10px; font-size:14px; color:#3B4250; border:1px solid transparent; }
  .nav a svg{ width:18px; height:18px; color:#7A8290; }
  .nav a:hover{ background:#EDF0F4; }
  .nav a.is-current{ background:#fff; border-color:var(--line); box-shadow:0 1px 2px rgba(16,24,40,.06); color:var(--ink); font-weight:500; }
  .nav a.is-current svg{ color:var(--accent); }
  .nav-label{ font-size:12.5px; color:#8A92A0; padding:18px 12px 6px; font-weight:500; }
  .sidebar-foot{ border-top:1px solid var(--line); }
  .main{ background:#fff; border-left:1px solid var(--line); border-radius:14px 0 0 14px; margin:8px 0 8px; box-shadow:0 1px 3px rgba(16,24,40,.05); }
  .topbar{ background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 32px; border-radius:14px 0 0 0; }
  .crumbs{ font-size:14px; } .crumbs b{ font-weight:500; }
  .search input{ height:38px; border-radius:10px; background:var(--bg); border:1px solid var(--line); }
  .icon-btn{ width:38px; height:38px; border-radius:10px; }
  .content{ padding:34px 44px 60px; max-width:1320px; }
  .page-head h1{ font-size:26px; font-weight:500; letter-spacing:-.015em; }
  .btn{ border-radius:10px; padding:10px 16px; font-weight:500; }
  .btn-primary{ background:var(--accent); box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 1px 2px rgba(16,24,40,.12); }
  .btn-primary:hover:not(:disabled){ background:var(--accent-700); }
  .btn-ghost{ border-color:var(--line-strong); box-shadow:0 1px 2px rgba(16,24,40,.05); }

  /* flat bordered cards everywhere */
  .card, .item, .stat, .ai-tile, .tile{ border:1px solid var(--line) !important; border-radius:var(--r-card) !important; box-shadow:var(--shadow) !important; background:#fff !important; }
  .stat::before, .ai-tile::before, .tile::before, .stat::after, .ai-tile::after, .tile::after{ display:none !important; }
  .stat:hover, .ai-tile:hover, .tile:hover{ transform:none !important; }
  .stat-top .ico, .tile-head .ico{ background:var(--field) !important; color:#4B5563 !important; box-shadow:none !important; }
  .ai-hero{ background:#fff !important; color:var(--ink) !important; border:1px solid var(--line); box-shadow:var(--shadow); }
  .ai-hero-kicker{ color:var(--muted) !important; } .ai-hero-sub, .ai-split-legend{ color:var(--muted) !important; } .ai-split-legend b{ color:var(--ink) !important; }
  .ai-split{ background:var(--field) !important; }
  .ai-radar .ring{ stroke:#E3E7ED; } .ai-radar .pulse{ stroke:rgba(31,111,181,.35); } .ai-radar .core{ fill:var(--accent); }
  .ai-hero-num, .ai-tile-num, .stat-num{ font-weight:500 !important; }

  /* ---- dashboard ---- */
  .dash-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap; }
  .dash-head h1{ margin:0; font-size:28px; font-weight:500; letter-spacing:-.02em; }
  .dash-head p{ margin:8px 0 0; color:var(--muted); font-size:14px; }
  .dash-head p b{ color:var(--ink); font-weight:500; }
  .range-sel{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line-strong); border-radius:10px; padding:0 10px 0 12px; height:40px; background:#fff; box-shadow:0 1px 2px rgba(16,24,40,.05); color:#3B4250; }
  .range-sel svg{ width:16px; height:16px; }
  .range-sel select{ border:none; background:none; font:inherit; font-size:14px; color:var(--ink); cursor:pointer; outline:none; }
  .dash-top{ display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:22px; margin-bottom:34px; }
  .dash-top > .card{ margin:0; }
  .chart-card{ padding:20px 22px 18px !important; }
  .chart-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .chart-cap{ font-size:12.5px; color:var(--muted); }
  .seg{ display:inline-flex; padding:3px; background:var(--field); border:1px solid var(--line); border-radius:10px; gap:2px; }
  .seg button{ border:none; background:none; padding:6px 12px; border-radius:7px; font-size:13.5px; color:var(--muted); cursor:pointer; }
  .seg button.is-on{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(16,24,40,.1), 0 0 0 1px var(--line); }
  .lc-wrap{ position:relative; }
  svg.lc{ width:100%; height:auto; display:block; overflow:visible; }
  svg.lc .gl{ stroke:#EEF0F3; stroke-dasharray:2 4; }
  svg.lc .tk{ stroke:#6B7280; fill:none; stroke-width:1.2; }
  svg.lc .ax{ font-family:var(--mono); font-size:10.5px; fill:#6B7280; }
  svg.lc .ln{ stroke-dasharray:1; stroke-dashoffset:1; animation:lcDraw 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
  svg.lc .cross{ stroke:#C4CAD4; stroke-dasharray:3 3; }
  @keyframes lcDraw{ to{ stroke-dashoffset:0; } }
  .lc-tip{ position:absolute; top:-6px; transform:translateX(-50%); background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 14px; box-shadow:0 12px 28px -12px rgba(16,24,40,.25); pointer-events:none; white-space:nowrap; min-width:130px; }
  .lc-tip-l{ font-size:12.5px; color:var(--muted); }
  .lc-tip-v{ font-size:13px; color:var(--muted); margin-top:1px; } .lc-tip-v b{ font-size:19px; color:var(--ink); font-weight:500; }
  .lc-tip-r{ display:flex; align-items:center; gap:7px; font-size:12px; color:#3B4250; margin-top:4px; }
  .lc-tip-r i{ width:8px; height:8px; border-radius:50%; } .lc-tip-r b{ margin-left:auto; padding-left:12px; font-family:var(--mono); font-weight:500; }
  .lc-legend{ display:flex; flex-wrap:wrap; gap:6px 20px; margin-top:12px; font-size:13.5px; color:#3B4250; }
  .lc-legend i{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:-1px; }
  .kpi-grid{ display:grid; grid-template-columns:1fr 1fr; padding:0 !important; overflow:hidden; }
  .kpi{ display:block; padding:24px 26px; color:inherit; text-decoration:none; border-right:1px solid var(--line); border-bottom:1px solid var(--line); transition:background .15s ease; }
  .kpi:nth-child(2n){ border-right:none; } .kpi:nth-child(n+3){ border-bottom:none; }
  a.kpi:hover{ background:#FAFBFC; }
  .kpi-label{ display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); }
  .kpi-label svg{ width:17px; height:17px; }
  .kpi-val{ display:flex; align-items:center; gap:10px; margin-top:16px; }
  .kpi-val > span:first-child{ font-size:26px; font-weight:500; letter-spacing:-.02em; color:var(--ink); font-variant-numeric:tabular-nums; }
  .dpill{ font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:6px; font-family:var(--mono); }
  .dpill.up{ background:#E3F4EC; color:#1B7A51; } .dpill.down{ background:#FDECEC; color:#C03030; } .dpill.flat{ background:var(--field); color:var(--muted); }
  .meter{ display:flex; gap:2px; height:10px; margin-top:14px; }
  .meter span{ flex:1; border-radius:1.5px; background:#E9ECF0; }
  .meter .l1{ background:#C4E6D3; } .meter .l2{ background:#84CBA3; } .meter .l3{ background:#3AA56F; } .meter .l4{ background:#1C7A4E; }
  .kpi-sub{ margin-top:10px; font-size:12.5px; color:var(--soft); }
  .tbl-head{ display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .tbl-head h2{ margin:0; font-size:21px; font-weight:500; letter-spacing:-.01em; }
  .tbl-spacer{ flex:1; }
  .tbl-search{ position:relative; display:flex; }
  .tbl-search svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--soft); }
  .tbl-search input{ height:40px; width:260px; border:1px solid var(--line-strong); border-radius:10px; padding:0 12px 0 34px; font:inherit; font-size:14px; box-shadow:0 1px 2px rgba(16,24,40,.05); }
  .tbl-search input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-100); }
  .tbl-head .btn svg{ width:16px; height:16px; }
  .tbl-card{ padding:0 !important; overflow:hidden; margin:0; }
  .tbl-scroll{ overflow-x:auto; }
  table.tbl{ width:100%; border-collapse:collapse; font-size:14px; }
  .tbl th{ text-align:left; font-weight:500; color:var(--muted); font-size:13.5px; padding:14px 18px; background:#FAFBFC; border-bottom:1px solid var(--line); white-space:nowrap; }
  .tbl td{ padding:13px 18px; border-bottom:1px solid var(--line); color:var(--ink); vertical-align:middle; }
  .tbl tbody tr:hover td{ background:#FAFBFC; }
  .td-main{ max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .td-date{ white-space:nowrap; color:#3B4250; }
  .td-mono{ font-family:var(--mono); font-size:12.5px; color:#3B4250; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .td-empty{ text-align:center; color:var(--muted); padding:28px !important; }
  .chip{ display:inline-block; font-size:12.5px; padding:3px 10px; border:1px solid var(--line-strong); border-radius:8px; background:#fff; white-space:nowrap; }
  .who-cell{ display:inline-flex; align-items:center; gap:10px; white-space:nowrap; }
  .who-cell small{ display:block; font-size:11.5px; color:var(--soft); font-family:var(--mono); }
  .av{ width:30px; height:30px; border-radius:50%; display:inline-grid; place-items:center; background:var(--field); border:1px solid var(--line); font-size:11.5px; font-weight:500; color:#3B4250; flex:none; }
  .status{ display:inline-block; font-size:13px; padding:3px 9px; border-radius:7px; white-space:nowrap; }
  .status.s-green{ background:#E6F4EC; color:#1B7A51; } .status.s-amber{ background:#FEF3E2; color:#C2620A; } .status.s-blue{ background:var(--accent-100); color:var(--accent-700); } .status.s-red{ background:#FDECEC; color:#C03030; }
  .tbl-foot{ display:flex; align-items:center; justify-content:space-between; padding:13px 18px; font-size:13.5px; color:var(--muted); background:#FAFBFC; }
  .tbl-foot b{ color:var(--ink); font-weight:500; }
  .pager{ display:flex; gap:6px; }
  .pager button{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:16px; color:#3B4250; }
  .pager button:disabled{ opacity:.4; cursor:default; }
  .rem-card{ margin-bottom:34px !important; }
  @media (max-width:1180px){ .dash-top{ grid-template-columns:minmax(0,1fr); } }
  @media (max-width:900px){ .shell{ margin:0; border-radius:0; min-height:100vh; } .main{ margin:0; border-radius:0; } .topbar{ border-radius:0; } .sidebar{ top:0; height:100vh; } .content{ padding:24px 18px 48px; } .tbl-search input{ width:100%; } .tbl-search{ flex:1; } }
  @media (max-width:560px){ .kpi-grid{ grid-template-columns:1fr; } .kpi{ border-right:none; border-bottom:1px solid var(--line) !important; } .kpi:last-child{ border-bottom:none !important; } }
  @media (prefers-reduced-motion: reduce){ svg.lc .ln{ animation:none; stroke-dashoffset:0; } }

  /* ---- Sidebar: dark green with a faint grid, geometric icons, square
     edges, orange accent bar on the current page ---- */
  .sidebar{ background-color:#17231E !important; background-image:linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size:28px 28px; color:#A9B8B0; font-family:'DM Sans', 'Inter', sans-serif; padding:22px 0 !important; }
  .brand{ padding:0 22px 22px !important; }
  .brand-name{ color:#F2F5F3; font-weight:600; letter-spacing:.01em; }
  .brand-name span{ color:#6F8279; letter-spacing:.14em; }
  .brand-mark{ border-radius:4px !important; box-shadow:0 0 0 1px rgba(255,255,255,.12); }
  .nav{ gap:0 !important; }
  .nav-label{ color:#5F7169 !important; font-family:var(--mono); font-size:10.5px !important; letter-spacing:.16em; text-transform:uppercase; padding:20px 26px 8px !important; font-weight:500 !important; }
  .nav a{ position:relative; border-radius:0 !important; border:none !important; padding:12px 26px !important; margin:0 14px 0 0; color:#A9B8B0 !important; font-size:15px !important; font-weight:400 !important; letter-spacing:.005em; box-shadow:none !important; background:transparent !important; gap:16px !important; transition:color .15s ease, background .15s ease; }
  .nav a svg{ width:19px !important; height:19px !important; color:#C7D2CC !important; }
  .nav a:hover{ color:#EEF3F0 !important; background:linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,0)) !important; }
  .nav a.is-current{ color:#FFFFFF !important; font-weight:500 !important; background:linear-gradient(90deg, rgba(232,112,64,.22), rgba(232,112,64,.06) 70%, rgba(232,112,64,0)) !important; }
  .nav a.is-current::before{ content:""; position:absolute; left:0; top:6px; bottom:6px; width:3px; background:#E8703F; }
  .nav a.is-current svg{ color:#FFFFFF !important; }
  .nav-badge{ margin-left:auto; min-width:22px; height:22px; padding:0 6px; border-radius:50%; background:#E8703F; color:#fff; font-size:11.5px; font-weight:600; display:grid; place-items:center; box-shadow:0 0 0 5px rgba(232,112,64,.18); font-family:var(--mono); }
  .sidebar-foot{ border-top:1px solid rgba(255,255,255,.08) !important; margin:0 0 0; padding:12px 0 0 !important; }
  .sidebar-foot a, .sidebar-foot button{ border-radius:0 !important; color:#A9B8B0 !important; padding:11px 26px !important; font-family:'DM Sans', sans-serif; gap:16px !important; }
  .sidebar-foot a:hover, .sidebar-foot button:hover{ background:rgba(255,255,255,.05) !important; color:#fff !important; }
  .sidebar-foot svg{ color:#C7D2CC; }

  /* ---- Settlement / team rows: grouped form + live preview ---- */
  [data-editor="settlements"] .grid-rail, [data-editor="team"] .grid-rail{ grid-template-columns:minmax(0,1fr); }
  [data-editor="settlements"] .grid-rail > aside, [data-editor="team"] .grid-rail > aside{ display:none !important; }
  .shell{ grid-template-columns:268px 1fr !important; }
  .item.is-compact{ border-radius:8px !important; }
  .item.is-compact.is-open{ border-color:#CBD3DE !important; box-shadow:0 18px 40px -28px rgba(16,24,40,.35) !important; }
  .item.is-compact.is-open .c-head, .item.is-team.is-open .c-head{ background:#FAFBFC !important; border-bottom:1px solid var(--line) !important; border-radius:8px 8px 0 0 !important; }
  .c-head:hover, .item.is-team .c-head:hover{ background:#FAFBFC !important; }
  .item.is-compact .item-body.is-grouped{ grid-template-columns:minmax(0,1fr) 280px !important; gap:0 !important; padding:0 !important; }
  .g-form{ padding:6px 24px 22px; border-right:1px solid var(--line); min-width:0; }
  .g-sec{ padding:18px 0 4px; border-bottom:1px dashed var(--line); }
  .g-sec:last-child{ border-bottom:none; }
  .g-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .g-num{ font-family:var(--mono); font-size:11px; color:#E8703F; letter-spacing:.06em; }
  .g-head b{ font-size:14px; font-weight:600; letter-spacing:.01em; text-transform:uppercase; font-family:'DM Sans', sans-serif; }
  .g-head > span:last-child{ font-size:12.5px; color:var(--muted); }

  // ---- Blog posts ----
  // One Markdown file per post in content/blog/, with the simple
  // "key: value" frontmatter generate_blog_posts.py parses. The body
  // supports only what that script renders (paragraphs, #/##/###

  // preview below is a direct port of its converter, so what you see is

  var blog = { root: $('#blogView'), posts: null, loaded: false, busy: false, readOnly: true, readOnlyReason: '', loadError: '', mode: 'list', cur: null, pristine: '', dirty: false, errors: {} };

  function parseFrontmatter(text){

    });

  function wordCount(s){ return String(s || '').split(/\s+/).filter(Boolean).length; }

  function loadBlogList(){
    blog.loaded = true; blog.busy = true; blog.loadError = ''; renderBlog();

      var files = (entries || []).filter(function(e){ return e.type === 'file' && /\.md$/i.test(e.name); });
      return Promise.all(files.map(function(e){

  function openPost(slugOrNew){

    } else {
      var p = (blog.posts || []).filter(function(x){ return x.slug === slugOrNew; })[0];
      if(!p){ location.hash = '#blog'; return; }
      blog.cur = { isNew: false, path: p.path, slug: p.slug, sha: p.sha, fields: { title: p.fields.title || '', date: p.fields.date || '', photo: p.fields.photo || '', ad: p.fields.ad || 'none', draft: /^(true|yes|1)$/i.test(String(p.fields.draft || '')) }, body: p.body || '', prevPhoto: p.fields.photo || '' };

      toast(p.fields.draft ? 'Draft saved.' : (wasNew ? 'Post published. It goes live on the next deploy.' : 'Post updated. The site refreshes on the next deploy.'));
      if(wasNew) history.replaceState(null, '', '#blog/' + p.slug);

  // ---- AI Crawlers (netlify/edge-functions/ai-bot-logger.js + netlify/
  // functions/ai-bot-stats.js) - a read-only view of which AI platforms
  // have actually visited the site. Not a Git Gateway call (no repo
  // content involved), but still gated: the request carries the signed-
  // in user's Identity JWT as a Bearer token, which the function itself
  // verifies server-side before returning anything - not reachable just
  // by knowing the URL. ----
  var aiCrawlers = { root: $('#aiCrawlersView'), loaded: false, busy: false, error: '', totals: {}, recent: [], daily: [], pages: {} };
  function loadAiCrawlers(){
    aiCrawlers.loaded = true; aiCrawlers.busy = true; aiCrawlers.error = ''; renderAiCrawlers();
    var user = currentUser();
    if(!user){
      // Identity may still be starting: wait briefly before giving up.
      var tries = 0, t = setInterval(function(){
        var u = currentUser();
        if(u){ clearInterval(t); loadAiCrawlers(); }
        else if(++tries > 25){ clearInterval(t); aiCrawlers.loaded = false; aiCrawlers.busy = false; aiCrawlers.error = 'Sign in to view this.'; renderAiCrawlers(); }
      }, 150);
      return;
    }
    // The endpoint itself checks this token server-side (gated, not a
    // public URL) - this header is what makes that check pass, not just
    // a formality.
    user.jwt().then(function(token){
      return fetch(aiStatsUrl(isoDay(addLocalDays(new Date(), -29)), isoDay(new Date())), { cache: 'no-store', headers: { Authorization: 'Bearer ' + token } });
    }).then(function(r){

      // = a real error worth reading) instead of a bare status code.
      return r.json().catch(function(){ return {}; }).then(function(b){
        throw new Error(r.status === 401
          ? 'The server didn\u2019t accept your login' + (b && b.reason ? ': ' + b.reason : '') + '. Try signing out and back in.'
          : (b && b.error) || ('Request failed (' + r.status + ')'));
      });
    }).then(function(data){
        aiCrawlers.totals = data.totals || {}; aiCrawlers.recent = data.recent || []; aiCrawlers.src = { hours: data.hours || {}, utc: data.daily || [] };
        aiCrawlers.daily = aiLocalDaily(data, isoDay(addLocalDays(new Date(), -29)), isoDay(new Date())); aiCrawlers.pages = data.pages || {};
        aiCrawlers.busy = false; renderAiCrawlers();
      })
      .catch(function(err){

        // try again instead of staying stuck on this error.

  // Crawler TYPE drives every color on this page (one categorical slot per

    live:     { label: 'Person search', color: 'var(--t-live)', hex: '#1baf7a', note: 'A real person asked an AI something just now and it fetched this page.' }
  };
  var AI_TYPE_ORDER = ['training', 'search', 'live'];
  var AI_TYPE_OF = {
    'ChatGPT-User': 'live', 'Claude-Web': 'live', 'Claude-User': 'live', 'anthropic-ai': 'live', 'Perplexity-User': 'live',

    setTimeout(function(){ node.textContent = fmt(to); }, (ms || 1000) + 400);

  // Animated radar for the hero: sweeping arm + expanding rings, with one
  // blip per platform seen (bigger blip = more hits), placed at a stable
  // angle so it doesn't jump around between refreshes.
  function aiRadar(platforms){
    var svg = svgEl('svg', { class: 'ai-radar', viewBox: '0 0 220 220', 'aria-hidden': 'true' });
    var defs = svgEl('defs');

      svgEl('stop', { offset: '0', 'stop-color': '#9fb3ff', 'stop-opacity': '0' }),

    defs.appendChild(grad); svg.appendChild(defs);
    [30, 60, 90].forEach(function(r){ svg.appendChild(svgEl('circle', { class: 'ring', cx: 110, cy: 110, r: r })); });
    svg.appendChild(svgEl('line', { x1: 110, y1: 18, x2: 110, y2: 202, stroke: 'rgba(159,179,255,0.12)' }));
    svg.appendChild(svgEl('line', { x1: 18, y1: 110, x2: 202, y2: 110, stroke: 'rgba(159,179,255,0.12)' }));
    ['p1', 'p2', 'p3'].forEach(function(c){ svg.appendChild(svgEl('circle', { class: 'pulse ' + c, cx: 110, cy: 110, r: 95, 'stroke-width': 1.5 })); });
    svg.appendChild(svgEl('g', { class: 'sweep' }, [ svgEl('path', { d: 'M110,110 L110,15 A95,95 0 0,1 177,43 Z', fill: 'url(#aiSweepGrad)' }) ]));

      });

  function buildInsights(recent, daily, from, to, src){

  function writeReport(w, daily, from, to, data){

      feedCard.innerHTML = '';
      var all = aiCrawlers.recent || [], dayList = [];
      all.forEach(function(r){ var d = isoDay(new Date(r.time)); if(dayList.indexOf(d) === -1) dayList.push(d); });
      dayList.sort();
      var oldestDay = dayList[0] || '', newestDay = dayList[dayList.length - 1] || '';
      var today = isoDay(new Date()), yest = isoDay(addLocalDays(new Date(), -1));
      // Date filter: a preset (all / today / yesterday / last 7 days) or a custom range.
      var fDate = aiCrawlers.feedDate || 'all', fType = aiCrawlers.feedType || '';
      var fFrom = '', fTo = '';
      if(fDate === 'today'){ fFrom = fTo = today; }
      else if(fDate === 'yesterday'){ fFrom = fTo = yest; }
      else if(fDate === '7'){ fFrom = isoDay(addLocalDays(new Date(), -6)); fTo = today; }
      else if(fDate === 'custom'){ fFrom = aiCrawlers.feedFrom || ''; fTo = aiCrawlers.feedTo || ''; if(fFrom && fTo && fFrom > fTo){ var sw = fFrom; fFrom = fTo; fTo = sw; } }
      var filtered = fDate !== 'all' || !!fType;
      var list = all.filter(function(r){ var d = isoDay(new Date(r.time)); return (!fFrom || d >= fFrom) && (!fTo || d <= fTo) && (!fType || aiTypeOf(r.bot) === fType); });
      function mkSel(label, opts, val, on){ var sel = el('select', { class: 'pl-type', 'aria-label': label, onchange: function(e){ on(e.target.value); renderFeed(); } }, opts.map(function(o){ return el('option', { value: o[0], text: o[1] }); })); sel.value = val; return sel; }
      feedCard.appendChild(el('div', { class: 'ai-card-head' }, [
        el('div', {}, [ el('h2', {}, [ 'Live activity', el('small', { text: filtered ? list.length + ' of ' + all.length : all.length + ' recorded' }) ]),
          el('p', { text: all.length ? 'Itemized visits from ' + shortDate(oldestDay) + ' to ' + shortDate(newestDay) + '. A referer only appears on person searches.' : 'A referer only appears on person searches.' }) ])
      ]));
      if(all.length){
        feedCard.appendChild(el('div', { class: 'feed-filters' }, [
          mkSel('Filter by visit type', [ ['', 'All types'], ['live', 'Person search'], ['search', 'AI Search'], ['training', 'Training'] ], fType, function(v){ aiCrawlers.feedType = v; }),
          mkSel('Filter by date', [ ['all', 'All dates'], ['today', 'Today'], ['yesterday', 'Yesterday'], ['7', 'Last 7 days'], ['custom', 'Custom range…'] ], fDate, function(v){ aiCrawlers.feedDate = v; }),
          filtered ? el('button', { type: 'button', class: 'feed-clear', text: 'Clear', onclick: function(){ aiCrawlers.feedDate = 'all'; aiCrawlers.feedType = ''; aiCrawlers.feedFrom = ''; aiCrawlers.feedTo = ''; renderFeed(); } }) : null
        ]));
        if(fDate === 'custom'){
          var dIn = function(label, key, val){ return el('label', { class: 'feed-date' }, [ el('span', { text: label }), el('input', { type: 'date', value: val, min: oldestDay, max: newestDay, onchange: function(e){ aiCrawlers[key] = e.target.value; renderFeed(); } }) ]); };
          feedCard.appendChild(el('div', { class: 'feed-range' }, [ dIn('From', 'feedFrom', aiCrawlers.feedFrom || oldestDay), el('span', { class: 'feed-dash', text: '→' }), dIn('To', 'feedTo', aiCrawlers.feedTo || newestDay) ]));
        }
      }
      if(!list.length){
        feedCard.appendChild(el('div', { class: 'empty-state', text: filtered ? 'No logged visits match these filters.' : 'Nothing yet.' }));
        return;
      }
      // Grouped by day (newest first), each visit shows its time of day.
      var feed = el('div', { class: 'ai-feed' }), lastDay = null, shown = 0, cutNode = null;
      list.forEach(function(r, i){
        var dt = new Date(r.time), d = isoDay(dt);
        if(d !== lastDay){
          lastDay = d;
          var cnt = list.filter(function(x){ return isoDay(new Date(x.time)) === d; }).length;
          feed.appendChild(el('div', { class: 'feed-day' }, [
            el('b', { text: d === today ? 'Today' : d === yest ? 'Yesterday' : dt.toLocaleDateString(undefined, { weekday: 'long' }) }),
            el('span', { text: dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) }),
            el('em', { text: cnt + ' visit' + (cnt === 1 ? '' : 's') })
          ]));
        }
        var type = aiTypeOf(r.bot), fresh = (Date.now() - dt.getTime()) < 3600000;
        var item = el('div', { class: 'ai-feed-item' }, [
          el('span', { class: 'ai-feed-dot' + (fresh ? ' is-fresh' : ''), style: 'background:' + AI_TYPES[type].hex }),
          el('div', { class: 'ai-feed-top' }, [ el('b', { text: aiPlatform(r.label) }), el('span', { class: 'feed-time', title: dt.toLocaleString(), text: dt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) + (fresh ? ' · ' + relTime(r.time) : '') }) ]),
          el('div', { class: 'ai-feed-path', text: r.path }),
          el('span', { class: 'ai-type', text: AI_TYPES[type].label + ' · ' + r.bot }),
          r.referer ? el('div', { class: 'ai-ref', text: 'from ' + r.referer }) : null
        ]);
        item.style.animationDelay = Math.min(i * 0.04, 0.6) + 's';
        feed.appendChild(item);
        if(++shown === 15) cutNode = item;
      });
      var scroller = el('div', { class: 'ai-feed-scroll' }, [ feed ]);
      feedCard.appendChild(scroller);
      if(list.length > 15){
        var hint = el('div', { class: 'ai-feed-hint', text: 'Scroll for ' + (list.length - 15) + ' more' });
        feedCard.appendChild(hint);
        requestAnimationFrame(function(){
          if(cutNode){ scroller.style.maxHeight = (cutNode.offsetTop + cutNode.offsetHeight + 4) + 'px'; scroller.classList.add('is-scroll'); }
        });
        scroller.addEventListener('scroll', function(){
          hint.classList.toggle('is-done', scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 4);
        });
      }
    }
    renderFeed();
    root.appendChild(el('div', { class: 'ai-grid2', style: 'margin-top:20px;' }, [ pagesCard, feedCard ]));

  }

  // ---- Routing (hash) ----
  var VIEW_TITLES = { overview: 'Dashboard', banner: 'Announcement Banner', settlements: 'Settlements', team: 'Legal Team', blog: 'Blog Posts', 'ai-crawlers': 'AI Visibility', 'search-updates': 'Search Updates' };
  var currentView = null, currentHash = null;
  function route(){
    var raw = (location.hash || '#overview').slice(1), parts = raw.split('/'), key = parts[0], sub = parts.slice(1).join('/');
    if(!VIEW_TITLES[key]) key = 'overview';
    var leaving = currentView && (currentView !== key || (currentView === 'blog' && currentHash !== raw));
    if(leaving){
      var dirtyEd = editors[currentView] && editors[currentView].dirty ? editors[currentView] : (currentView === 'blog' && blog.dirty ? blog : null);
      if(dirtyEd){
        if(!confirm('You have unsaved changes on this page. Leave without saving?')){ history.replaceState(null, '', currentHash ? '#' + currentHash : '#overview'); return; }
        dirtyEd.dirty = false; if(dirtyEd !== blog) dirtyEd.loaded = false;
      }
    }
    var switching = currentView !== key || !currentHash || currentHash.split('/')[0] !== raw.split('/')[0] || (key === 'blog' && currentHash !== raw);
    currentView = key; currentHash = raw;
    document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('is-active', v.getAttribute('data-view') === key); });
    if(switching){
      enteringUntil = Date.now() + 1600;
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('is-entering'); });
      var activeView = document.querySelector('.view.is-active');
      if(activeView){ void activeView.offsetWidth; activeView.classList.add('is-entering'); }
      clearTimeout(route.enterTimer);
      route.enterTimer = setTimeout(function(){ document.querySelectorAll('.view.is-entering').forEach(function(v){ v.classList.remove('is-entering'); }); }, 1600);
    }
    document.body.setAttribute('data-view', key);
    if(key === 'overview'){ loadOverviewActivity(); loadOverviewAi(); loadReminders(); }
    document.querySelectorAll('#nav a').forEach(function(a){ a.classList.toggle('is-current', a.getAttribute('data-view') === key); });
    $('#crumbCurrent').textContent = VIEW_TITLES[key];
    searchInput.value = '';
    if(editors[key] && !editors[key].loaded) loadEditor(editors[key]);
    if(key === 'blog'){
      if(sub){
        if(!blog.loaded || !blog.posts){
          if(!blog.loaded) loadBlogList();
          var waitFor = setInterval(function(){ if(!blog.busy){ clearInterval(waitFor); if(location.hash.slice(1) === raw) openPost(sub); } }, 80);
        } else openPost(sub);
      } else {
        blog.mode = 'list'; blog.cur = null;
        if(!blog.loaded) loadBlogList(); else renderBlog();
      }
    }
    if(key === 'ai-crawlers' && !aiCrawlers.loaded) loadAiCrawlers();
    if(key === 'search-updates') renderSearchUpdates();
    closeAiPop(); setMenu(false); window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();

  // Exposed for debugging in the browser console (client-side state only).
  window.PingleAdmin = {
    serialize: function(key){ return editors[key] ? serialize(editors[key]) : null; },
    validate: function(key){ return editors[key] ? validate(editors[key]) : null; },
    editor: function(key){ return editors[key]; },
    blog: blog, mdToHtml: mdToHtml, serializePost: serializePost, parseFrontmatter: parseFrontmatter, slugify: slugify
  };
})();
</script>
</body>
</html>
