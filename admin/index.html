<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pingle Law — Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Decap CMS's own stylesheet sets a light gray background everywhere
     and its own font stack. Match the site's look: dark navy background
     + Inter on the pre-login screen, white background once logged in.
     The cms-pre-login/cms-post-login class is toggled by the script
     below based on Netlify Identity state.

     Decap's own component classes carry a build-specific random hash
     (e.g. "css-zwje8v-LoginButton-button-..."), so these use [class*=]
     substring selectors on the stable, human-readable part of each name
     rather than the full class, so they keep working across CMS updates
     that only change the hash. */
  body.cms-pre-login{ background:#0A0F27 !important; }
  body.cms-post-login{ background:#ffffff !important; }

  body, input, textarea, select, button{ font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

  [class*="StyledAuthenticationPage"]{
    gap:28px !important;
  }
  [class*="LoginButton-button"]{
    background:#B38A3C !important;
    color:#0A0F27 !important;
    font-weight:600 !important;
    border-radius:8px !important;
    box-shadow:0 12px 28px -10px rgba(179,138,60,0.55) !important;
    transition:background .2s ease, transform .2s ease !important;
  }
  [class*="LoginButton-button"]:hover{
    background:#C9A24F !important;
    transform:translateY(-1px);
  }
  [class*="GoBackButtonStyle"]{
    opacity:0.6;
    transition:opacity .2s ease;
  }
  [class*="GoBackButtonStyle"]:hover{ opacity:1; }
</style>
<!-- Decap CMS (formerly Netlify CMS) — the actual editor UI. Everything
     below this line is boilerplate; the real configuration lives in
     admin/config.yml. -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
  // If Netlify Identity redirects here after an invite/password-recovery
  // link (e.g. #invite_token=...) instead of via the homepage, handle it
  // the same way so the "set your password" flow still works.
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", (user) => {
      document.body.classList.toggle("cms-pre-login", !user);
      document.body.classList.toggle("cms-post-login", !!user);
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
    window.netlifyIdentity.on("logout", () => {
      document.body.classList.remove("cms-post-login");
      document.body.classList.add("cms-pre-login");
    });
  }
</script>
</body>
</html>
