<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pingle Law — Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
  /* Decap CMS's own stylesheet sets a light gray background on the
     pre-login screen; override it to match the site's dark navy. */
  body{ background:#0A0F27 !important; }
</style>
<!-- Decap CMS (formerly Netlify CMS) — the actual editor UI. Everything
     below this line is boilerplate; the real configuration lives in
     admin/config.yml. -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
  // If Netlify Identity redirects here after an invite/password-recovery
  // link (e.g. #invite_token=...) instead of via the homepage, handle it
  // the same way so the "set your password" flow still works.
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", (user) => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
<script>
  // "files" collections that hold exactly one file (Settlements, Legal
  // Team) normally make editors click the collection in the sidebar,
  // then click that single file again to open the editor. Skip the
  // middle step: jump straight from the collection list to its one
  // entry. Keyed by collection name -> that file's "name" (its slug).
  (function () {
    var SINGLE_FILE_COLLECTIONS = { settlements: "settlements", team: "team" };
    function skipListIfSingleFile(e) {
      var m = /^#\/collections\/([^\/]+)$/.exec(window.location.hash);
      if (!m || !SINGLE_FILE_COLLECTIONS[m[1]]) return;
      var name = m[1];
      // If we just came FROM that same collection's entry (e.g. the
      // editor's own back arrow), let it land on the list instead of
      // bouncing straight back into the entry — otherwise there's no
      // way to ever leave that collection's editor once inside it.
      // Only auto-skip when arriving fresh (initial load, or switching
      // in from a different collection/sidebar link).
      if (e && e.oldURL && e.oldURL.indexOf("#/collections/" + name + "/entries/") !== -1) return;
      window.location.hash = "#/collections/" + name + "/entries/" + SINGLE_FILE_COLLECTIONS[name];
    }
    window.addEventListener("hashchange", skipListIfSingleFile);
    skipListIfSingleFile();
  })();
</script>
</body>
</html>
