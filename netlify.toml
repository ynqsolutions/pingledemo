[build]
  publish = "."
  # 1. Turns any Markdown posts added via /admin (content/blog/*.md) into
  #    real blog-<slug>.html pages, same pattern as generate_sitemap.py.
  # 2. Bakes team-card and settlement-tile HTML into about.html and
  #    results-and-testimonials.html from content/team.json and
  #    content/settlements.json — static HTML, not client-side fetch, so it
  #    still works when a page is opened directly (fetch() can't read local
  #    files from a file:// page). See generate_cms_sections.py.
  # 3. Rebuilds rss.html from outside legal-news RSS feeds, filtered to
  #    employment-law keywords. See generate_rss_page.py for the feed list
  #    and a scheduled function that reruns this build periodically so the
  #    page actually stays fresh, not just on the next unrelated deploy.
  # 4. Regenerates sitemap.xml from whatever .html pages currently exist in
  #    the repo (including the just-generated posts/rss page), so it always
  #    reflects reality without hand-editing. See generate_sitemap.py for
  #    the rules (noindex pages excluded, etc).
  command = "python3 generate_blog_posts.py && python3 generate_cms_sections.py && python3 generate_rss_page.py && python3 generate_sitemap.py"

[functions]
  directory = "netlify/functions"

# ---------------------------------------------------------------------------
# Security headers (applied to every route). Netlify serves this site from
# its global CDN, so these are the only origin-level controls we need — no
# server config to manage as traffic scales.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.behold.so https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://share.facepop.io; connect-src 'self' https://*.behold.so https://identity.netlify.com; base-uri 'self'; form-action 'self'; object-src 'none'"

# /admin (the Decap CMS editor) needs a much looser CSP than the rest of the
# site — it loads its editor bundle from a CDN, talks to Netlify's Identity
# and Git Gateway APIs, and to GitHub's API to commit content changes. It's
# gated behind Netlify Identity login regardless, so this relaxed policy
# only ever reaches authenticated editors, not general site visitors.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.netlify.com https://api.github.com https://identity.netlify.com; frame-src https://api.netlify.com; base-uri 'self'; form-action 'self'; object-src 'none'"

# CSS/JS are not hashed/fingerprinted (no build step), so a visitor's browser
# cache can't tell an old deploy's file apart from a new one at the same URL.
# `immutable` + a 1-year max-age would make a visitor's browser keep serving
# a stale main.js/style.css for a year after every fix, regardless of new
# deploys — so this stays short until the site moves to hashed filenames.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

# Images are referenced by content-specific filenames already (they only
# change when replaced under a new name), so long caching is safe here.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Pretty URLs / redirects. Add entries here as more pages are built
# (e.g. "/practice-areas/wrongful-termination" -> "/practice-areas.html").
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
